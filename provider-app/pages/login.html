<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provider Login - ServiceHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        :root {
            --primary-color: #007bff;
            --secondary-color: #6c757d;
            --success-color: #28a745;
            --danger-color: #dc3545;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 420px;
            width: 100%;
            padding: 40px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-section h1 {
            color: var(--primary-color);
            font-weight: 700;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .logo-section .badge {
            background: var(--success-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin: 20px 0 25px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            display: block;
        }

        .form-group input {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px 15px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
            outline: none;
        }

        .form-group input::placeholder {
            color: #aaa;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .form-check {
            margin-top: 15px;
            margin-bottom: 20px;
        }

        .form-check input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            border: 2px solid #e0e0e0;
            border-radius: 4px;
        }

        .form-check label {
            margin-left: 8px;
            cursor: pointer;
            margin-bottom: 0;
            font-weight: 500;
            font-size: 14px;
            color: #666;
        }

        .form-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .form-footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .form-footer a:hover {
            color: #0056b3;
            text-decoration: underline;
        }

        .divider {
            margin: 25px 0;
            text-align: center;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: #e0e0e0;
        }

        .divider span {
            background: white;
            padding: 0 10px;
            color: #999;
            font-size: 14px;
            position: relative;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            font-weight: 600;
            color: #999;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 15px;
        }

        .tab-btn.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .alert {
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 20px;
            font-size: 14px;
            border: none;
        }

        .alert-danger {
            background: #ffe5e5;
            color: #d32f2f;
        }

        .alert-success {
            background: #e5ffe5;
            color: #388e3c;
        }

        .loading-spinner {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .spinner-border {
            color: var(--primary-color);
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 25px;
            }

            .logo-section h1 {
                font-size: 24px;
            }

            .section-title {
                font-size: 18px;
                margin: 15px 0 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Logo Section -->
        <div class="logo-section">
            <h1><i class="fas fa-briefcase"></i> ServiceHub</h1>
            <span class="badge">Service Provider Portal</span>
        </div>

        <!-- Alert Messages -->
        <div id="alertMessage" class="alert" style="display: none;"></div>

        <!-- Tab Navigation -->
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('login')">Login</button>
            <button class="tab-btn" onclick="switchTab('register')">Register</button>
        </div>

        <!-- LOGIN TAB -->
        <div id="login" class="tab-content active">
            <h5 class="section-title">Welcome Back</h5>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input 
                        type="email" 
                        id="loginEmail" 
                        class="form-control" 
                        placeholder="your@email.com" 
                        required>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input 
                        type="password" 
                        id="loginPassword" 
                        class="form-control" 
                        placeholder="Enter your password" 
                        required>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">Remember me</label>
                </div>

                <div class="loading-spinner" id="loginSpinner">
                    <div class="spinner-border spinner-border-sm" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="loginSubmitBtn">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>

            <div class="form-footer">
                <a href="#" onclick="toggleForgotPassword(event)">Forgot password?</a>
            </div>
        </div>

        <!-- REGISTER TAB -->
        <div id="register" class="tab-content">
            <h5 class="section-title">Create Account</h5>
            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="registerName">Full Name</label>
                    <input 
                        type="text" 
                        id="registerName" 
                        class="form-control" 
                        placeholder="John Doe" 
                        required>
                </div>

                <div class="form-group">
                    <label for="registerEmail">Email Address</label>
                    <input 
                        type="email" 
                        id="registerEmail" 
                        class="form-control" 
                        placeholder="your@email.com" 
                        required>
                </div>

                <div class="form-group">
                    <label for="registerPhone">Phone Number</label>
                    <input 
                        type="tel" 
                        id="registerPhone" 
                        class="form-control" 
                        placeholder="+880 1234567890" 
                        required>
                </div>

                <div class="form-group">
                    <label for="registerPassword">Password</label>
                    <input 
                        type="password" 
                        id="registerPassword" 
                        class="form-control" 
                        placeholder="Minimum 8 characters" 
                        minlength="8"
                        required>
                </div>

                <div class="form-group">
                    <label for="registerConfirmPassword">Confirm Password</label>
                    <input 
                        type="password" 
                        id="registerConfirmPassword" 
                        class="form-control" 
                        placeholder="Confirm your password" 
                        required>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="agreeTerms" required>
                    <label class="form-check-label" for="agreeTerms">
                        I agree to the <a href="#" style="color: var(--primary-color);">Terms & Conditions</a>
                    </label>
                </div>

                <div class="loading-spinner" id="registerSpinner">
                    <div class="spinner-border spinner-border-sm" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="registerSubmitBtn">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
            </form>
        </div>
    </div>

    <script>
        // Tab Switching
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');
            
            clearAlert();
        }

        // Alert Management
        function showAlert(message, type = 'danger') {
            const alertEl = document.getElementById('alertMessage');
            alertEl.className = `alert alert-${type}`;
            alertEl.innerHTML = `<i class="fas fa-${type === 'danger' ? 'exclamation-circle' : 'check-circle'}"></i> ${message}`;
            alertEl.style.display = 'block';
        }

        function clearAlert() {
            document.getElementById('alertMessage').style.display = 'none';
        }

        // Login Handler
        function handleLogin(event) {
            event.preventDefault();
            clearAlert();

            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const rememberMe = document.getElementById('rememberMe').checked;

            // Show loading
            document.getElementById('loginSpinner').style.display = 'block';
            document.getElementById('loginSubmitBtn').disabled = true;

            // Simulate API call (Replace with actual API call)
            setTimeout(() => {
                // TODO: Replace with actual authentication API call
                // For now, store login info in localStorage
                if (email && password.length >= 8) {
                    localStorage.setItem('providerEmail', email);
                    localStorage.setItem('providerAuthenticated', 'true');
                    
                    if (rememberMe) {
                        localStorage.setItem('rememberProvider', 'true');
                    }

                    showAlert('Login successful! Redirecting...', 'success');
                    
                    setTimeout(() => {
                        window.location.href = '/provider';
                    }, 1500);
                } else {
                    showAlert('Invalid email or password', 'danger');
                    document.getElementById('loginSpinner').style.display = 'none';
                    document.getElementById('loginSubmitBtn').disabled = false;
                }
            }, 1000);
        }

        // Register Handler
        function handleRegister(event) {
            event.preventDefault();
            clearAlert();

            const name = document.getElementById('registerName').value;
            const email = document.getElementById('registerEmail').value;
            const phone = document.getElementById('registerPhone').value;
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('registerConfirmPassword').value;

            // Validation
            if (password !== confirmPassword) {
                showAlert('Passwords do not match', 'danger');
                return;
            }

            if (password.length < 8) {
                showAlert('Password must be at least 8 characters', 'danger');
                return;
            }

            // Show loading
            document.getElementById('registerSpinner').style.display = 'block';
            document.getElementById('registerSubmitBtn').disabled = true;

            // TODO: Replace with actual registration API call
            setTimeout(() => {
                localStorage.setItem('providerEmail', email);
                localStorage.setItem('providerName', name);
                localStorage.setItem('providerPhone', phone);
                localStorage.setItem('providerAuthenticated', 'true');

                showAlert('Registration successful! Redirecting to dashboard...', 'success');
                
                setTimeout(() => {
                    window.location.href = '/provider';
                }, 1500);
            }, 1000);
        }

        function toggleForgotPassword(event) {
            event.preventDefault();
            showAlert('Please contact support at support@servicehub.com', 'success');
        }

        // Check if already logged in
        window.addEventListener('load', () => {
            if (localStorage.getItem('providerAuthenticated') === 'true') {
                window.location.href = '/provider';
            }
        });
    </script>
</body>
</html>
